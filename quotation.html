      + '<div><span class="lbl">Prepared by</span>'+esc(CO.name)+(String(S.meta.preparedBy).trim() ? '<br>'+esc(S.meta.preparedBy) : '')+'</div><div><span class="lbl">Date</span>'+fmtDate(S.meta.date)+'</div>'
      + '<div><span class="lbl">Revision &middot; Project ref</span>'+escOr(S.meta.rev,'R1')+(String(S.meta.ref).trim() ? ' &middot; '+esc(S.meta.ref) : '')+'</div><div><span class="lbl">Valid until</span>'+(vu ? fmtDate(vu)+' ('+parseInt(S.meta.validDays,10)+' days)' : '&mdash;')+'</div></div>';
    h += '<div class="party"><div><span class="lbl">From</span><span class="nm">'+esc(CO.name)+'</span> ('+esc(CO.reg)+')<br>'+esc(CO.address)+'<br>'+esc(CO.phone)+'<br>'+esc(CO.email)+'</div>'
      + '<div><span class="lbl">To</span><span class="nm">'+escOr(S.client.company,'&mdash;')+'</span>'+(String(S.client.reg).trim() ? ' ('+esc(S.client.reg)+')' : '')+(clientLine ? '<br>'+nl2br(clientLine) : '')+(String(S.client.contact).trim() ? '<br>Attn: '+esc(S.client.contact) : '')+(contact ? '<br>'+contact : '')+'</div></div>';
    h += '<h2 class="docsec"><small>1.0</small>Scope of this quotation</h2><hr class="docrule">';
    h += '<p>'+(String(S.project.scope).trim() ? nl2br(S.project.scope) : '<span style="color:#9aa5b8">Scope not stated.</span>')+'</p>';
    if(String(S.project.site).trim()) h += '<p style="margin-top:6px"><b>Site / delivery:</b> '+esc(S.project.site)+'</p>';
    var n = 2;
    S.sections.forEach(function(sec, si){
      if(!sec.items.length) return;
      h += '<h2 class="docsec"><small>'+n+'.0</small><span class="key">'+sec.key+'</span>'+escOr(sec.title,'Section')+(sec.taxable ? '<span class="taxtag">(SST applicable)</span>' : '')+'</h2><hr class="docrule">';
      h += '<div class="tblscroll"><table class="doct"><thead><tr>'+(thumbs?'<th></th>':'')+'<th>ID</th><th>Item / description</th><th>Supplied by</th><th class="r">Qty</th><th class="r">Unit price (RM)</th><th class="r">Amount (RM)</th></tr></thead><tbody>';
      sec.items.forEach(function(it, ii){
        h += '<tr>'+(thumbs ? '<td class="im">'+(it.img ? '<img src="'+esc(it.img)+'" alt="" onerror="this.remove()"/>' : '')+'</td>' : '')+'<td class="id">'+itemId(sec, ii)+'</td>'
          + '<td>'+nl2br(it.desc)+(it.sku ? '<span class="sku">Cat. ref '+esc(it.sku)+'</span>' : '')+'</td><td>'+escOr(it.supplier,'&mdash;')+'</td><td class="r">'+fmtQty(it.qty)+'</td>'
          + '<td class="r">'+(it.price == null ? '<span class="tbc">TBC</span>' : fmt(it.price))+'</td><td class="r"><b>'+(it.price == null ? '<span class="tbc">TBC</span>' : fmt(lineAmt(it)))+'</b></td></tr>';
      });
      h += '</tbody><tfoot><tr class="subtotal"><td colspan="'+(thumbs?6:5)+'">Subtotal '+sec.key+' &mdash; '+escOr(sec.title,'Section')+'</td><td class="r">'+fmt(T.subs[si])+'</td></tr></tfoot></table></div>';
      if(S.opts.gallery){
        var g = sec.items.map(function(it, ii){ return { it:it, id:itemId(sec, ii) }; }).filter(function(x){ return x.it.img; });
        if(g.length) h += '<h3 class="sub">'+n+'.1 Reference illustrations</h3><div class="gallery">'+g.map(function(x){ return '<div class="g"><img src="'+esc(x.it.img)+'" alt="" onerror="this.closest(\'.g\').remove()"/><div class="gid">'+x.id+'</div><div class="gnm">'+esc(x.it.desc)+'</div></div>'; }).join('')+'</div><p class="hint" style="margin-top:4px">Indicative illustrations &mdash; final make/model per confirmed order.</p>';
      }
      n++;
    });
    if(!T.count) h += '<div class="notebox warn">This quotation has no line items.</div>';
    h += '<h2 class="docsec"><small>'+n+'.0</small>Summary &amp; totals</h2><hr class="docrule"><div class="totals"><div>';
    if(T.tbc) h += '<div class="notebox warn"><b>'+T.tbc+' line'+(T.tbc>1?'s':'')+' marked TBC</b> &mdash; unit price to be confirmed; totals exclude '+(T.tbc>1?'these items':'this item')+'.</div>';
    h += '</div><table class="tot"><tbody>';
    S.sections.forEach(function(sec, si){ if(sec.items.length) h += '<tr><td>Subtotal '+sec.key+' &mdash; '+escOr(sec.title,'Section')+'</td><td class="r">'+fmt(T.subs[si])+'</td></tr>'; });
    if(T.disc > 0) h += '<tr><td>Discount ('+T.dp+'%)</td><td class="r">&minus; '+fmt(T.disc)+'</td></tr>';
    h += '<tr class="sub"><td>Subtotal (before SST)</td><td class="r">'+fmt(T.net)+'</td></tr>';
    h += '<tr><td>SST @ '+T.rate+'%<span class="subnote">'+(T.base > 0 ? 'on taxable sections: RM '+fmt(T.base) : 'no taxable sections')+'</span></td><td class="r">'+fmt(T.sst)+'</td></tr>';
    if(Math.abs(T.adj) >= 0.005) h += '<tr><td>Rounding</td><td class="r">'+(T.adj<0?'&minus; ':'')+fmt(Math.abs(T.adj))+'</td></tr>';
    h += '<tr class="grand"><td>Total payable (incl. SST)</td><td class="r">RM '+fmt(T.total)+'</td></tr></tbody></table></div>';
    n++;
    if(S.milestones.length){
      h += '<h2 class="docsec"><small>'+n+'.0</small>Payment milestones</h2><hr class="docrule"><div class="tblscroll"><table class="ms"><thead><tr><th>Milestone</th><th>Trigger</th><th class="r">%</th><th class="r">Amount incl. SST (RM)</th></tr></thead><tbody>';
      S.milestones.forEach(function(m){ h += '<tr><td>'+escOr(m.name,'&mdash;')+'</td><td>'+nl2br(m.trigger)+'</td><td class="r">'+fmtQty(m.pct)+'%</td><td class="r">'+fmt(T.total*num(m.pct)/100)+'</td></tr>'; });
      h += '</tbody></table></div>'; n++;
    }
    if(String(S.notes).trim()) h += '<div class="notebox">'+esc(S.notes)+'</div>';
    var terms = S.terms.map(function(t){ return String(t).trim(); }).filter(Boolean);
    if(terms.length){ h += '<h2 class="docsec"><small>'+n+'.0</small>Terms &amp; conditions</h2><hr class="docrule"><ol class="terms">'+terms.map(function(t){ var mm = t.match(/^([A-Za-z][A-Za-z &\/-]{1,28})\.\s+(.*)$/); return '<li>'+(mm ? '<b>'+esc(mm[1])+'.</b> '+esc(mm[2]) : esc(t))+'</li>'; }).join('')+'</ol>'; n++; }
    if(S.opts.sig){
      h += '<h2 class="docsec"><small>'+n+'.0</small>Acceptance</h2><hr class="docrule"><p>Signature below confirms acceptance of the schedules, the total of <b>RM '+fmt(T.total)+'</b> (incl. SST) and the terms above, and authorises '+esc(CO.name)+' to proceed against the payment milestones.</p>';
      h += '<div class="sigrow"><div class="sig"><b>For the Client</b>'+escOr(S.client.company,'&nbsp;')+(String(S.sig.client).trim() ? '<br>'+esc(S.sig.client) : '')+'<div class="line"></div><div class="sl">Name, signature &amp; company stamp</div><div class="line"></div><div class="sl">Date</div></div>'
        + '<div class="sig"><b>For '+esc(CO.name)+'</b>'+escOr(S.sig.jrtech, escOr(S.meta.preparedBy,'&nbsp;'))+'<div class="line"></div><div class="sl">Name &amp; signature</div><div class="line"></div><div class="sl">Date</div></div></div>';
    }
    h += '<div class="sheetfoot"><span>'+esc(no)+' &middot; '+escOr(S.meta.rev,'R1')+' &middot; '+esc(CO.name)+'</span><span>'+STATUS[st]+' &middot; '+fmtDate(S.meta.date)+'</span></div>';
    document.getElementById('doc').innerHTML = h;
    document.getElementById('top-title').textContent = 'Quotation ' + no + (S.client.company ? ' · ' + S.client.company : '');
    document.title = no + ' ' + (S.meta.rev||'R1') + ' — Quotation — JR-Tech Solution Sdn Bhd';
  }

  function fail(msg){
    document.getElementById('doc').innerHTML = '<div class="empty"><h2>No quotation in this link</h2><p>'+esc(msg)+'</p><p class="hint" style="margin-top:10px">Ask JR-Tech to resend the quotation link, or request the PDF.</p></div>';
  }
  function boot(){
    var m = location.hash.match(/^#q=([A-Za-z0-9._-]+)/);
    if(!m){ fail('This page shows a quotation only when opened from a quotation link.'); return; }
    decodeState(m[1]).then(function(o){ if(!o || !o.meta || !Array.isArray(o.sections)) throw 0; render(normalise(o)); })
      .catch(function(){ fail('The link appears incomplete or was altered. Please open the full link exactly as it was sent.'); });
  }
  window.addEventListener('hashchange', boot);
  boot();
})();
</script>
</body>
</html>
